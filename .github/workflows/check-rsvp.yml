name: 出欠状況（RSVP）確認

on:
  # schedule:
  #   - cron: '*/30 * * * *'  # 30分ごとに自動実行（合図があるまでコメントアウトで無効化）
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-rsvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: パッケージインストール
        run: npm install
      - name: 出欠状況を確認
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # graph にすると、予定表で作成した会議の出欠も読み取る（Gmail の返信の読み取りは、旧方式の会議のために続ける）
          MAIL_PROVIDER: gmail
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          M365_SENDER: ${{ secrets.M365_SENDER }}
        run: node scripts/check-rsvp.js
