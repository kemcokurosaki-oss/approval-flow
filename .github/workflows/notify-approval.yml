name: 承認フロー通知

on:
  # schedule:
  #   - cron: '*/15 * * * *'  # 15分ごとに自動実行（合図があるまでコメントアウトで無効化）
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'テストモード（黒崎のみ送信・デフォルトON）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# リポジトリへの書き込みは不要（メール送信のみ）なので読み取り権限だけにする
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: パッケージインストール
        run: npm install
      - name: 承認フロー通知を送信
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # gmail または graph（Microsoft 365 の共有メールボックスから送る）
          MAIL_PROVIDER: gmail
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          M365_SENDER: ${{ secrets.M365_SENDER }}
          TEST_MODE: ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.test_mode || 'true') }}
        run: node scripts/notify-approval.js
