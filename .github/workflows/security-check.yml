name: セキュリティ定期チェック

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日 8:00 JST。月曜は週次、毎月1日は月次まとめとして実行（scripts/security-check.js）
  workflow_dispatch:
    inputs:
      scope:
        description: 'チェックの範囲（auto は曜日・日付で自動判定）'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'daily'
          - 'weekly'
          - 'monthly'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: パッケージインストール
        run: npm install
      # 前回までに見つかった問題の一覧（ハッシュ値のみ）。新しい問題だけを通知するために使う
      - name: 前回の状態を読み込む
        uses: actions/cache/restore@v4
        with:
          path: .security-state
          key: security-state-${{ github.run_id }}
          restore-keys: security-state-
      - name: セキュリティチェック
        env:
          CHECK_SCOPE: ${{ github.event.inputs.scope || 'auto' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # anon キーはアプリの画面にも載っている公開用のもの
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnZWtqemtyeWJyc3dzeGxjYnZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4ODQ3MjIsImV4cCI6MjA4NDQ2MDcyMn0.BsEj53lV3p76yE9fMPTaLn7ocKTNzYPTqIAnBafYItU
          SECURITY_MONITOR_DB_URL: ${{ secrets.SECURITY_MONITOR_DB_URL }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          M365_SENDER: ${{ secrets.M365_SENDER }}
        run: node scripts/security-check.js
      - name: 今回の状態を保存する
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .security-state
          key: security-state-${{ github.run_id }}
