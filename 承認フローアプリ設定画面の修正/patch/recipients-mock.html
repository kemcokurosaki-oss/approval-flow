<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>通知の宛先設定 — 修正後デザイン（静的モック）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* --- モック表示用（アプリには不要） --- */
  body { margin:0; padding:40px; background:#e7ebf2; font-family:'Noto Sans JP','メイリオ',Meiryo,sans-serif; color:#20293a; display:flex; gap:40px; align-items:flex-start; flex-wrap:wrap; }
  .mock-col { display:flex; flex-direction:column; gap:10px; }
  .mock-caption { font-size:14px; font-weight:700; color:#16233a; }
  .mock-panel { width:740px; background:#fff; border:1px solid #e3e8f0; border-radius:14px; box-shadow:0 12px 40px rgba(20,36,63,.14); overflow:hidden; }
  .mock-panel-header { height:52px; padding:0 16px; border-bottom:1px solid #e3e8f0; display:flex; align-items:center; justify-content:space-between; }
  .mock-panel-title { font-size:14px; font-weight:700; color:#16233a; }
  .mock-close { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:8px; background:#f1f4f9; color:#6b7789; font-size:15px; cursor:pointer; }
  .settings-page-body { padding:18px; max-height:760px; overflow-y:auto; }
  .settings-sticky-header { position:sticky; top:-18px; z-index:5; margin:-18px -18px 10px; padding:10px 18px; background:#fff; box-shadow:0 1px 4px rgba(20,36,63,.08); }
  .section-title { font-size:15px; font-weight:700; color:#8a94a6; margin-bottom:12px; }
  .btn { padding:7px 16px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:700; font-family:inherit; }
  .btn-sm { padding:4px 10px; font-size:13px; }
  .btn-primary { background:#2f6fb0; color:#fff; }
  .btn-primary:hover { background:#255d97; }
  .btn-secondary { background:#eef1f6; color:#5b6b80; }
  .btn-xs { padding:4px 10px; font-size:13px; font-weight:700; border-radius:7px; border:1px solid #e0e6ef; background:#f6f8fb; color:#5b6b80; cursor:pointer; font-family:inherit; }

  /* ==========================================================
     ここから下が style.css に追記する内容
     （patch/style-append-recipients.css と同一）
     ========================================================== */
  .recip-list { border:1px solid #e5e9f1; border-radius:10px; overflow:hidden; }
  .recip-head, .recip-row { display:grid; grid-template-columns:minmax(0,1fr) 96px 148px 16px; column-gap:10px; align-items:center; }
  .recip-head { padding:8px 14px; background:#fbfcfe; border-bottom:1px solid #eef1f6; font-size:12px; font-weight:700; color:#9aa5b6; letter-spacing:.04em; }
  .recip-row { width:100%; padding:11px 14px; border:none; border-bottom:1px solid #f4f6fa; background:#fff; cursor:pointer; text-align:left; font-family:inherit; }
  .recip-row:last-child { border-bottom:none; }
  .recip-row:hover { background:#f9fbfe; }
  .recip-flow-name { font-size:14px; font-weight:700; color:#16233a; }
  .recip-fixed-count { font-size:13px; color:#5b6b80; }
  .recip-dyn-on, .recip-dyn-off, .recip-dyn-none { display:inline-flex; align-items:center; min-height:22px; padding:1px 8px; border-radius:6px; font-size:12px; white-space:nowrap; }
  .recip-dyn-on { background:#f6f8fb; border:1px solid #e5e9f1; color:#7c8798; }
  .recip-dyn-off { background:#fdf6e3; color:#8a6d00; font-weight:700; }
  .recip-dyn-none { background:#f6f8fb; border:1px solid #eef1f6; color:#b6c1d2; }
  .recip-chevron { color:#c3ccd9; font-size:14px; font-weight:700; text-align:right; }

  .recip-group { border:1px solid #e5e9f1; border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .recip-group-header { display:flex; align-items:center; gap:8px; padding:9px 14px; background:#f6f8fb; border-bottom:1px solid #eef1f6; }
  .recip-group-title { font-size:14px; font-weight:700; color:#16233a; }
  .recip-group-kind { font-size:11px; color:#9aa5b6; }
  .recip-group-count { margin-left:auto; display:inline-flex; align-items:center; min-height:20px; padding:0 8px; border-radius:10px; background:#fff; border:1px solid #e0e6ef; color:#5b6b80; font-size:12px; font-weight:700; }
  .recip-person-row { display:grid; grid-template-columns:18px 86px minmax(0,1fr) auto; column-gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid #f4f6fa; cursor:pointer; }
  .recip-person-row:last-child { border-bottom:none; }
  .recip-person-row:hover { background:#f9fbfe; }
  .recip-person-row input[type="checkbox"] { width:16px; height:16px; margin:0; accent-color:#2f6fb0; cursor:pointer; }
  .recip-person-name { font-size:14px; font-weight:700; color:#16233a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recip-person-email { font-size:13px; color:#7c8798; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recip-note { font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px; background:#fdf6e3; color:#8a6d00; }
  .recip-empty { padding:10px 14px; font-size:13px; color:#8a94a6; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .recip-dyn-row { display:grid; grid-template-columns:18px minmax(0,1fr) 44px; column-gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid #f4f6fa; cursor:pointer; }
  .recip-dyn-row:last-child { border-bottom:none; }
  .recip-dyn-row:hover { background:#f9fbfe; }
  .recip-dyn-row input[type="checkbox"] { width:16px; height:16px; margin:0; accent-color:#2f6fb0; cursor:pointer; }
  .recip-dyn-label { font-size:14px; color:#3d4a5d; }
  .recip-badge-on, .recip-badge-off { display:inline-flex; align-items:center; justify-content:center; min-height:20px; padding:0 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .recip-badge-on { background:#e8f6ee; color:#166534; }
  .recip-badge-off { background:#f1f4f9; color:#98a3b4; }

  .recip-footer { position:sticky; bottom:-18px; z-index:5; display:flex; align-items:center; gap:12px; margin:10px -18px -18px; padding:12px 18px; background:#fff; border-top:1px solid #eef1f6; box-shadow:0 -1px 4px rgba(20,36,63,.06); }
  .recip-footer-count { font-size:13px; color:#5b6b80; }
  .recip-footer-count strong { color:#16233a; font-size:14px; }
  .recip-footer .btn { margin-left:auto; }
</style>
</head>
<body>

<!-- ============ 一覧 ============ -->
<div class="mock-col">
  <div class="mock-caption">通知の宛先設定（フロー一覧）</div>
  <div class="mock-panel">
    <div class="mock-panel-header"><span class="mock-panel-title">⚙ 設定</span><button class="mock-close">✕</button></div>
    <div class="settings-page-body">
      <div class="settings-sticky-header"><button class="btn btn-sm btn-secondary">← 戻る</button></div>
      <div class="section-title">通知の宛先設定</div>
      <div class="recip-list">
        <div class="recip-head">
          <div>フロー</div><div>固定宛先</div><div>工番担当者の自動通知</div><div></div>
        </div>
        <button class="recip-row">
          <span class="recip-flow-name">組立完了申請</span>
          <span class="recip-fixed-count">3名</span>
          <span><span class="recip-dyn-on">全てON</span></span>
          <span class="recip-chevron">›</span>
        </button>
        <button class="recip-row">
          <span class="recip-flow-name">試運転完了申請</span>
          <span class="recip-fixed-count">4名</span>
          <span><span class="recip-dyn-on">全てON</span></span>
          <span class="recip-chevron">›</span>
        </button>
        <button class="recip-row">
          <span class="recip-flow-name">簡易検査開催案内</span>
          <span class="recip-fixed-count">5名</span>
          <span><span class="recip-dyn-off">1件OFF</span></span>
          <span class="recip-chevron">›</span>
        </button>
        <button class="recip-row">
          <span class="recip-flow-name">外観検査開催案内</span>
          <span class="recip-fixed-count">6名</span>
          <span><span class="recip-dyn-on">全てON</span></span>
          <span class="recip-chevron">›</span>
        </button>
        <button class="recip-row">
          <span class="recip-flow-name">出荷確認会議開催案内</span>
          <span class="recip-fixed-count">6名</span>
          <span><span class="recip-dyn-on">全てON</span></span>
          <span class="recip-chevron">›</span>
        </button>
        <button class="recip-row">
          <span class="recip-flow-name">出荷準備完了申請</span>
          <span class="recip-fixed-count">2名</span>
          <span><span class="recip-dyn-none">対象外</span></span>
          <span class="recip-chevron">›</span>
        </button>
        <button class="recip-row">
          <span class="recip-flow-name">出荷確定申請</span>
          <span class="recip-fixed-count">5名</span>
          <span><span class="recip-dyn-off">2件OFF</span></span>
          <span class="recip-chevron">›</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 詳細 ============ -->

  <div class="mock-panel">

      <div class="settings-sticky-header"><button class="btn btn-sm btn-secondary">← 戻る</button></div>

      <div class="recip-group">

          <span class="recip-group-count">1 / 2</span>
        </div>
        <label class="recip-person-row">
          <input type="checkbox" checked>
          <span class="recip-person-name">田中</span>
          <span class="recip-person-email">tanaka@kusakabe.com</span>
          <span></span>
        </label>
        <label class="recip-person-row">
          <input type="checkbox">
          <span class="recip-person-name">佐々木</span>
          <span class="recip-person-email">sasaki@kusakabe.com</span>

        </label>
      </div>

      <div class="recip-group">
        <div class="recip-group-header">
          <span class="recip-group-title">技戦部門</span>
          <span class="recip-group-kind">部署から選択</span>
          <span class="recip-group-count">1 / 2</span>
        </div>
        <label class="recip-person-row">
          <input type="checkbox" checked>

        </label>
        <label class="recip-person-row">
          <input type="checkbox">
          <span class="recip-person-name">小林</span>

          <span></span>
        </label>
      </div>

      <div class="recip-group">
        <div class="recip-group-header">
          <span class="recip-group-title">物流課</span>
          <span class="recip-group-kind">部署から選択</span>
          <span class="recip-group-count">2 / 3</span>
        </div>
        <label class="recip-person-row">
          <input type="checkbox" checked>
          <span class="recip-person-name">山下</span>
          <span class="recip-person-email">y-yamashita@kusakabe.com</span>

        </label>
        <label class="recip-person-row">
          <input type="checkbox" checked>
          <span class="recip-person-name">廣田</span>

          <span></span>
        </label>
        <label class="recip-person-row">
          <input type="checkbox">

          <span></span>
        </label>
      </div>

      <div class="recip-group">
        <div class="recip-group-header">
          <span class="recip-group-title">工番担当者の自動通知</span>
          <span class="recip-group-kind">部署単位でON / OFF</span>
        </div>
        <label class="recip-dyn-row">
          <input type="checkbox" checked>

          <span class="recip-badge-on">ON</span>
        </label>
        <label class="recip-dyn-row">
          <input type="checkbox">
          <span class="recip-dyn-label">操業担当者（操業課長・部長を含む）</span>
          <span class="recip-badge-off">OFF</span>
        </label>
        <label class="recip-dyn-row">
          <input type="checkbox" checked>
          <span class="recip-dyn-label">営業担当者</span>
          <span class="recip-badge-on">ON</span>
        </label>
        <label class="recip-dyn-row">
          <input type="checkbox">
          <span class="recip-dyn-label">設計担当者（上長への通知を含む）</span>
          <span class="recip-badge-off">OFF</span>
        </label>
      </div>

      <div class="recip-footer">
        <span class="recip-footer-count">固定宛先 選択中 <strong>5名</strong></span>
        <button class="btn btn-primary">保存する</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
