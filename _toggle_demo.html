<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>トグルデザイン比較</title>
<style>
    body { font-family: 'Noto Sans JP','メイリオ',sans-serif; background:#eef1f6; padding:40px; }
    h2 { color:#16233a; }
    .demo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border: 1px solid #e3e8f0;
        border-radius: 10px;
        padding: 12px 20px;
        margin-bottom: 40px;
    }
    .left-group, .right-group { display: flex; align-items: center; gap: 10px; }
    .group-label { font-size: 12px; color: #9aa5b6; font-weight: bold; letter-spacing: .06em; margin-right: 4px; }

    /* ---- 共通：絞り込み用ピルボタン（3つ）---- */
    .pill-btn {
        border: 1px solid #e0e6ef;
        background: #fff;
        border-radius: 20px;
        padding: 7px 16px;
        font-size: 13px;
        color: #5b6b80;
        cursor: pointer;
        transition: background .12s, border-color .12s, color .12s;
    }
    .pill-btn:hover { border-color: #cdd8e8; color:#16233a; }
    .pill-btn.active { background:#2f6fb0; border-color:#2f6fb0; color:#fff; font-weight:700; }
    .pill-btn.active[data-c="overdue"] { background:#e5484d; border-color:#e5484d; }
    .pill-btn.active[data-c="ship"] { background:#8e44ad; border-color:#8e44ad; }

    /* ---- パターンA: iOSスイッチ風 ---- */
    .switch-label { display:flex; align-items:center; gap:8px; font-size:13px; color:#5b6b80; cursor:pointer; user-select:none; }
    .switch { position:relative; width:38px; height:22px; }
    .switch input { opacity:0; width:0; height:0; }
    .switch-track { position:absolute; inset:0; background:#ccd3de; border-radius:22px; transition:.15s; }
    .switch-track::before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
    .switch input:checked + .switch-track { background:#2ba55d; }
    .switch input:checked + .switch-track::before { transform: translateX(16px); }

    /* ---- パターンB: 色反転ボタン風 ---- */
    .invert-btn {
        border: 1px solid #d5dbe4;
        background: #fff;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        color: #5b6b80;
        cursor: pointer;
        font-weight: 600;
    }
    .invert-btn.active { background:#2ba55d; border-color:#2ba55d; color:#fff; }
</style>
</head>
<body>

<h2>パターンA：iOSスイッチ風（右側に完了済みトグル）</h2>
<div class="demo-header">
    <div class="left-group">
        <span class="group-label">絞り込み</span>
        <button class="pill-btn active" data-c="mine">自分の担当</button>
        <button class="pill-btn" data-c="overdue">未申請・未承認</button>
        <button class="pill-btn" data-c="ship">出荷後対応</button>
    </div>
    <div class="right-group">
        <label class="switch-label">
            完了済み表示
            <span class="switch">
                <input type="checkbox" onchange="this.closest('.switch-label').querySelector('.switch-track')">
                <span class="switch-track"></span>
            </span>
        </label>
    </div>
</div>

<h2>パターンB：色反転ボタン風（右側に完了済みトグル）</h2>
<div class="demo-header">
    <div class="left-group">
        <span class="group-label">絞り込み</span>
        <button class="pill-btn active" data-c="mine">自分の担当</button>
        <button class="pill-btn" data-c="overdue">未申請・未承認</button>
        <button class="pill-btn" data-c="ship">出荷後対応</button>
    </div>
    <div class="right-group">
        <button class="invert-btn" onclick="this.classList.toggle('active'); this.textContent = this.classList.contains('active') ? '完了済み表示中' : '完了済みを表示';">完了済みを表示</button>
    </div>
</div>

<script>
document.querySelectorAll('.pill-btn').forEach(b => b.addEventListener('click', () => b.classList.toggle('active')));
</script>
</body>
</html>
